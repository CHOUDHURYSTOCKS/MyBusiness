<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growth Calculator</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    background:linear-gradient(135deg,#4f46e5,#06b6d4);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:1100px;
    max-width:100%;
    background:#fff;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    overflow:hidden;
}

.header{
    background:linear-gradient(135deg,#4338ca,#0891b2);
    color:white;
    padding:25px;
    text-align:center;
}

.content{
    padding:30px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#4338ca;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#312e81;
}

.summary{
    margin-top:25px;
    background:#eef4ff;
    padding:20px;
    border-radius:15px;
}

.summary h2{
    color:#312e81;
    margin-bottom:10px;
}

.steps{
    margin-top:20px;
    background:#f7f7f7;
    padding:20px;
    border-radius:15px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#4338ca;
    color:white;
}

th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}

tr:nth-child(even){
    background:#f2f6ff;
}

.footer{
    text-align:center;
    padding:20px;
    color:#666;
}

.result{
    font-size:28px;
    color:#0f766e;
    font-weight:700;
}
</style>

</head>
<body>

<div class="container">

<div class="header">
<h1>📈 Investment / Growth Calculator</h1>
<p>Calculate amount growth with Percentage or Multiplication</p>
</div>

<div class="content">

<div class="grid">

<div>
<label>Initial Amount (₹)</label>
<input type="number" id="amount" placeholder="1000">
</div>

<div>
<label>Growth Interval</label>
<select id="interval">
<option>Daily</option>
<option>Weekly</option>
<option>Monthly</option>
<option>Quarterly</option>
</select>
</div>

<div>
<label>Number of Intervals</label>
<input type="number" id="periods" placeholder="10">
</div>

<div>
<label>Growth Type</label>
<select id="type" onchange="toggleFields()">
<option value="percent">Percentage Increase</option>
<option value="multiple">Multiply</option>
</select>
</div>

<div id="percentBox">
<label>Increase %</label>
<input type="number" id="percent" placeholder="10">
</div>

<div id="multipleBox" style="display:none;">
<label>Multiplier</label>
<select id="multiplier">
<option value="2">Double (2x)</option>
<option value="3">Triple (3x)</option>
<option value="4">4 Times</option>
<option value="5">5 Times</option>
<option value="10">10 Times</option>
</select>
</div>

</div>

<button onclick="calculate()">Calculate Growth</button>

<div class="summary" id="summary" style="display:none;">
<h2>Final Result</h2>
<div class="result" id="finalAmount"></div>
</div>

<div class="steps" id="steps" style="display:none;">
<h2>Calculation Steps</h2>

<p id="formula"></p>

<table id="resultTable">
<thead>
<tr>
<th>Step</th>
<th>Interval</th>
<th>Amount (₹)</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

</div>

<div class="footer">
Designed with ❤️ using HTML, CSS & JavaScript - Debabrata Choudhury
</div>

</div>

<script>

function toggleFields(){

let type=document.getElementById("type").value;

document.getElementById("percentBox").style.display=
(type=="percent")?"block":"none";

document.getElementById("multipleBox").style.display=
(type=="multiple")?"block":"none";

}

function calculate(){

let amount=parseFloat(document.getElementById("amount").value);

let periods=parseInt(document.getElementById("periods").value);

let interval=document.getElementById("interval").value;

let type=document.getElementById("type").value;

let tbody=document.querySelector("#resultTable tbody");

tbody.innerHTML="";

let current=amount;

for(let i=1;i<=periods;i++){

if(type=="percent"){

let p=parseFloat(document.getElementById("percent").value);

current=current*(1+p/100);

}else{

let m=parseFloat(document.getElementById("multiplier").value);

current=current*m;

}

let row=`
<tr>
<td>${i}</td>
<td>${interval}</td>
<td>₹ ${current.toLocaleString('en-IN',{
minimumFractionDigits:2,
maximumFractionDigits:2
})}</td>
</tr>`;

tbody.innerHTML+=row;

}

document.getElementById("summary").style.display="block";
document.getElementById("steps").style.display="block";

document.getElementById("finalAmount").innerHTML=
"₹ "+current.toLocaleString('en-IN',{
minimumFractionDigits:2,
maximumFractionDigits:2
});

let formula="";

if(type=="percent"){

let p=parseFloat(document.getElementById("percent").value);

formula=`
<b>Formula Used:</b><br><br>

Final Amount = Initial Amount × (1 + ${p}/100)<sup>${periods}</sup><br><br>

= ₹${amount.toLocaleString()} × (1 + ${p/100})<sup>${periods}</sup>
`;

}else{

let m=parseFloat(document.getElementById("multiplier").value);

formula=`
<b>Formula Used:</b><br><br>

Final Amount = Initial Amount × ${m}<sup>${periods}</sup><br><br>

= ₹${amount.toLocaleString()} × ${m}<sup>${periods}</sup>
`;

}

document.getElementById("formula").innerHTML=formula;

}

</script>

</body>
</html>
